name: Fetch data

on:
  schedule:
    # 03:00 UTC = 11:00 SGT, after MAS publishes the previous day's SORA (by 9am).
    - cron: "0 3 * * *"
  workflow_dispatch:

# Each job sets its own permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: fetch-data
  cancel-in-progress: false

# Separate jobs, so a token that can write never shares a job with npm or
# the project's code. "build" installs packages and runs the fetchers, the
# data-quality check, tests and build with a read-only token. "commit" can
# push, but runs no npm and no project code: it only accepts JSON files under
# data/. "notify" can only write issues, and also runs no npm or project
# code: it reads data/quality.json, checks every field with jq, and keeps one
# issue in step with the open flags. A compromised dependency in "build"
# could at worst produce data that fails those checks (or that nightly CI
# then tests); it can never push code or workflows.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # No install scripts run (see ci.yml).
      - run: npm ci --ignore-scripts
      # Fetches new days, validates every file, and writes nothing (exit 1)
      # if any check fails, so yesterday's data stays live.
      - run: npm run fetch-data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The data-quality check (scripts/quality/run.ts) reads the rates and
      # never changes them; it writes data/quality.json and the job summary.
      # A severe flag (a unit error or an inverted rate) exits 1: nothing is
      # committed and yesterday's data stays live. Soft flags don't block.
      - run: npm run quality
      # The new data must pass everything the site depends on before it is
      # committed: type-check, lint, all unit tests, data validation (all part
      # of `npm run check`) and the production build. If any step fails, the
      # job stops here, nothing is committed, and the failed run is emailed
      # to the workflow's owner. (Commits pushed with GITHUB_TOKEN don't
      # trigger the CI workflow, so this is the only check new data gets
      # before the nightly CI run.)
      - run: npm run check
      - run: npm run build
      - name: Upload data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: data/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the updated data files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      # Only the runner's own node, for JSON.parse: no npm, no project code.
      # A path git has to quote (unusual characters) doesn't start with
      # "data/", so it fails too. New files are refused: the fetchers only
      # rewrite the files already committed, so a new series' first file
      # comes in through a reviewed PR.
      - name: Check that only existing JSON files under data/ changed
        id: verify
        run: |
          changed=$(git status --porcelain=v1 --untracked-files=all --no-renames)
          if [ -z "${changed}" ]; then
            echo "No data changes."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bad=0
          while IFS= read -r line; do
            code="${line:0:2}"
            path="${line:3}"
            case "${path}" in
              data/*) ;;
              *) echo "::error::Changed outside data/: ${path}"; bad=1; continue ;;
            esac
            if [ "${code}" = "??" ]; then
              echo "::error::New file (only existing files may change): ${path}"
              bad=1
              continue
            fi
            if [ -L "${path}" ] || [ ! -f "${path}" ]; then
              echo "::error::Not a regular file (deleted or a link): ${path}"
              bad=1
              continue
            fi
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${path}"; then
              echo "OK ${path}"
            else
              echo "::error::Not valid JSON: ${path}"
              bad=1
            fi
          done <<< "${changed}"
          [ "${bad}" -eq 0 ] || exit 1
          echo "changed=true" >> "${GITHUB_OUTPUT}"
      - name: Commit and push
        if: steps.verify.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          git -c core.hooksPath=/dev/null commit -m "data: update $(TZ=Asia/Singapore date +%F)"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}

  # Keeps one issue, "Data quality: open flags", in step with
  # data/quality.json: opened or updated while flags are open, closed when
  # none are. No checkout and no npm or project code: the only input is the
  # file from the build job, and jq keeps only fields that match a fixed
  # shape (a three-letter code, an ISO date, a known kind, numbers), so
  # nothing else in the file can reach the issue. The body is built here.
  notify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Data quality: open flags"
        run: |
          set -euo pipefail
          # A file that isn't the expected shape fails the job and leaves
          # the issue alone, rather than reading as "no open flags".
          if ! jq -e '(.checkedThrough | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.open | type == "array")' \
            data/quality.json > /dev/null; then
            echo "::error::data/quality.json is not in the expected shape."
            exit 1
          fi
          # Keep only well-formed flags, with only the expected fields.
          jq -c '
            def iso: type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$");
            def num: type == "number";
            def numOrNull: . == null or type == "number";
            {
              checked: .checkedThrough,
              open: [
                .open[]
                | select(type == "object")
                | select(.currency | type == "string" and test("^[A-Z]{3}$"))
                | select(.date | iso)
                | select(.kind as $k | ["unit", "inverted", "spike", "move", "stale", "outlier"] | index($k) != null)
                | select(.severity as $s | ["severe", "soft"] | index($s) != null)
                | select((.move | num) and (.z | numOrNull) and (.peerZ | numOrNull) and (.score | numOrNull))
                | {currency, date, kind, severity, move, z, peerZ, score}
              ]
            }' data/quality.json > clean.json
          count=$(jq '.open | length' clean.json)
          checked=$(jq -r '.checked' clean.json)
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$count" -eq 0 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "No open flags as of ${checked}."
            fi
            echo "No open flags (checked through ${checked})."
            exit 0
          fi
          jq -r '
            def fixed(d): if . == null then "n/a" else (. * pow(10; d) | round / pow(10; d) | tostring) end;
            "The nightly data-quality check has \(.open | length) open flag(s), checked through \(.checked).\n\n"
            + "| Currency | Date | Kind | Severity | Move | z | Peer z | Forest score |\n"
            + "|---|---|---|---|---|---|---|---|\n"
            + ([.open[] | "| \(.currency) | \(.date) | \(.kind) | \(.severity) | \(.move * 100 | fixed(1))% | \(.z | fixed(1)) | \(.peerZ | fixed(1)) | \(.score | fixed(2)) |"] | join("\n"))
            + "\n\nTo close a flag, add its day to `scripts/fetch/known-anomalies.ts` in a PR: `jump` if the move is real, `upstream-error` if the source published a bad rate (see `docs/quality/flag-handling.md`). This issue is updated each night."
          ' clean.json > body.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
