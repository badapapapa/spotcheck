name: Fetch data

on:
  schedule:
    # 03:00 UTC = 11:00 SGT, after MAS publishes the previous day's SORA (by 9am).
    - cron: "0 3 * * *"
  workflow_dispatch:

# Each job sets its own permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: fetch-data
  cancel-in-progress: false

# Two jobs, so the token that can push never shares a job with npm or the
# project's code. "build" installs packages and runs the fetchers, tests and
# build with a read-only token. "commit" can push, but runs no npm and no
# project code: it only accepts JSON files under data/. A compromised
# dependency in "build" could at worst produce data that fails those checks
# (or that nightly CI then tests); it can never push code or workflows.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # No install scripts run (see ci.yml).
      - run: npm ci --ignore-scripts
      # Fetches new days, validates every file, and writes nothing (exit 1)
      # if any check fails, so yesterday's data stays live.
      - run: npm run fetch-data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The new data must pass everything the site depends on before it is
      # committed: type-check, lint, all unit tests, data validation (all part
      # of `npm run check`) and the production build. If any step fails, the
      # job stops here, nothing is committed, and the failed run is emailed
      # to the workflow's owner. (Commits pushed with GITHUB_TOKEN don't
      # trigger the CI workflow, so this is the only check new data gets
      # before the nightly CI run.)
      - run: npm run check
      - run: npm run build
      - name: Upload data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: data/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the updated data files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: data
      # Only the runner's own node, for JSON.parse: no npm, no project code.
      # A path git has to quote (unusual characters) doesn't start with
      # "data/", so it fails too.
      - name: Check that only JSON files under data/ changed
        id: verify
        run: |
          changed=$(git status --porcelain=v1 --untracked-files=all --no-renames)
          if [ -z "${changed}" ]; then
            echo "No data changes."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bad=0
          while IFS= read -r line; do
            path="${line:3}"
            case "${path}" in
              data/*) ;;
              *) echo "::error::Changed outside data/: ${path}"; bad=1; continue ;;
            esac
            if [ -L "${path}" ] || [ ! -f "${path}" ]; then
              echo "::error::Not a regular file (deleted or a link): ${path}"
              bad=1
              continue
            fi
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${path}"; then
              echo "OK ${path}"
            else
              echo "::error::Not valid JSON: ${path}"
              bad=1
            fi
          done <<< "${changed}"
          [ "${bad}" -eq 0 ] || exit 1
          echo "changed=true" >> "${GITHUB_OUTPUT}"
      - name: Commit and push
        if: steps.verify.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data
          git -c core.hooksPath=/dev/null commit -m "data: update $(TZ=Asia/Singapore date +%F)"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
