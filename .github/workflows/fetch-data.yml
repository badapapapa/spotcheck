name: Fetch data

on:
  schedule:
    # 03:00 UTC = 11:00 SGT, after MAS publishes the previous day's SORA (by 9am).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write # to commit the updated data files

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # The token isn't left in .git/config for the fetch, install, test
      # and build steps: only the commit step gets it, to push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # No install scripts run (see ci.yml).
      - run: npm ci --ignore-scripts
      # Fetches new days, validates every file, and writes nothing (exit 1)
      # if any check fails, so yesterday's data stays live.
      - run: npm run fetch-data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # The new data must pass everything the site depends on before it is
      # committed: type-check, lint, all unit tests, data validation (all part
      # of `npm run check`) and the production build. If any step fails, the
      # job stops here, nothing is committed, and the failed run is emailed
      # to the workflow's owner. (Commits pushed with GITHUB_TOKEN don't
      # trigger the CI workflow, so this is the only check new data gets
      # before the nightly CI run.)
      - run: npm run check
      - run: npm run build
      - name: Commit if data changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(TZ=Asia/Singapore date +%F)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
