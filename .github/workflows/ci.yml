name: CI

on:
  push:
  pull_request:
  # Nightly at 05:00 UTC (13:00 SGT), two hours after the 03:00 UTC data job.
  # The data job's own commits use GITHUB_TOKEN, which doesn't trigger this
  # workflow, so this run catches anything the new data breaks (including the
  # Playwright smoke tests and the secret scan). Failed scheduled runs are
  # emailed to whoever last changed this schedule.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit SHA (a tag can be moved; a SHA can't), with
# the version alongside. Dependabot's github-actions updates keep the pins
# current. `npm ci --ignore-scripts`: no install script in the tree is needed
# (the only one, unrs-resolver's, is a fallback for a missing native binary).

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from checksums.txt in the
      # official v8.30.1 release; matches GitHub's digest for that asset.
      # Update it together with the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every past commit is scanned
      # The CLI is used directly rather than gitleaks-action: the action only
      # scans the pushed commit range, which fails on a repo's first push and
      # skips history. The repo is small, so scanning everything is cheap.
      #
      # The tarball is cached, not the extracted binary, because GITLEAKS_SHA256
      # is the tarball's hash: the check below runs on every job, cache hit or
      # not. Only the download is skipped, so a release-download outage can't
      # fail the scan once the cache exists.
      - name: Restore gitleaks tarball from cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if [ ! -f "${tarball}" ]; then
            curl -sSfLO --retry 3 --retry-delay 5 "${base}/${tarball}"
          fi
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan git history
        run: ${{ runner.temp }}/gitleaks git --redact --verbose .
