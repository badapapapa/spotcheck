name: CI

on:
  push:
  pull_request:
  # Nightly at 05:00 UTC (13:00 SGT), two hours after the 03:00 UTC data job.
  # The data job's own commits use GITHUB_TOKEN, which doesn't trigger this
  # workflow, so this run catches anything the new data breaks (including the
  # Playwright smoke tests and the secret scan). Failed scheduled runs are
  # emailed to whoever last changed this schedule.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every past commit is scanned
      # The CLI is used directly rather than gitleaks-action: the action only
      # scans the pushed commit range, which fails on a repo's first push and
      # skips history. The repo is small, so scanning everything is cheap.
      - name: Install gitleaks (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan git history
        run: ${{ runner.temp }}/gitleaks git --redact --verbose .
